version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /local/voice-pipeline
    schedule:
      interval: weekly
    groups:
      pip:
        update-types: [minor, patch]
    ignore:
      # The latest aiohttp requires multidict<7.
      - dependency-name: multidict
        update-types: [version-update:semver-major]
      # The latest tokenizers (via faster-whisper) requires huggingface-hub<2.
      - dependency-name: huggingface-hub
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directories:
      - /local/asterisk
      - /local/voice-pipeline
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]

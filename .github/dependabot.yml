version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # The Node major follows the user's machine, which runs the MCP server.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: /local/voice-pipeline
    schedule:
      interval: weekly
    groups:
      uv:
        update-types: [minor, patch]
    ignore:
      # The latest aiohttp requires multidict<7.
      - dependency-name: multidict
        update-types: [version-update:semver-major]
      # The latest tokenizers (via faster-whisper) requires huggingface-hub<2.
      - dependency-name: huggingface-hub
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directories:
      - /local/asterisk
      - /local/caddy
      - /local/voice-pipeline
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]
    ignore:
      # The voice pipeline's Python minor is pinned in `pyproject.toml` and
      # `.python-version`; only patch releases of the base image update.
      - dependency-name: python
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]

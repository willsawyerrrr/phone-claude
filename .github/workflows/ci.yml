name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run format:check

  voice-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target test -t voice-pipeline-test local/voice-pipeline
      - run: docker run --rm voice-pipeline-test

  voice-pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: local/voice-pipeline
          target: smoke
          tags: voice-pipeline-smoke
          load: true
          cache-from: type=gha,scope=voice-pipeline-smoke
          cache-to: type=gha,mode=max,scope=voice-pipeline-smoke
      - run: docker run --rm voice-pipeline-smoke

  mcp-server-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f mcp-server/Dockerfile -t mcp-server-test .

  local-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck local/up.sh local/audition.sh local/test-render-config.sh local/asterisk/render-config.sh local/asterisk/start.sh
      - run: local/test-render-config.sh

  ios:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app
    steps:
      - uses: actions/checkout@v7
      - uses: willsawyerrrr/platform/.github/actions/xcode-cache@main
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Test
        working-directory: ios
        run: |
          udid=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          xcodebuild test -project PhoneClaude.xcodeproj -scheme PhoneClaude \
            -destination "platform=iOS Simulator,id=$udid"

  ci-status:
    name: CI Status
    if: always()
    needs:
      - ci
      - voice-pipeline
      - voice-pipeline-smoke
      - mcp-server-docker
      - local-scripts
      - ios
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi

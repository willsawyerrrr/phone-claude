name: phone-claude-local

services:
  asterisk:
    build: ./asterisk
    restart: unless-stopped
    environment:
      HOST_LAN_IP: ${HOST_LAN_IP:?Set HOST_LAN_IP to this machine's LAN IP}
      SIP_PORT: ${SIP_PORT:-5060}
      RTP_START: ${RTP_START:-10000}
      RTP_END: ${RTP_END:-10100}
      LOCAL_NET: ${LOCAL_NET:-127.0.0.0/8}
      SOFTPHONE_USERNAME: ${SOFTPHONE_USERNAME:-phone}
      SOFTPHONE_PASSWORD: ${SOFTPHONE_PASSWORD:?Set SOFTPHONE_PASSWORD}
      ARI_USERNAME: ${ARI_USERNAME:-phone-claude}
      ARI_PASSWORD: ${ARI_PASSWORD:?Set ARI_PASSWORD}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
      TLS_PORT: ${TLS_PORT:-5061}
    ports:
      - "${SIP_PORT:-5060}:5060/udp"
      - "${SIP_PORT:-5060}:5060/tcp"
      - "${TLS_PORT:-5061}:5061/tcp"
      - "${RTP_START:-10000}-${RTP_END:-10100}:${RTP_START:-10000}-${RTP_END:-10100}/udp"
      - "${ARI_BIND_ADDRESS:-127.0.0.1}:${ARI_PORT:-8088}:8088"
    volumes:
      - caddy-data:/caddy-data:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -u "$$ARI_USERNAME:$$ARI_PASSWORD" http://127.0.0.1:8088/ari/asterisk/ping &&
          asterisk -rx "pjsip show endpoint $$SOFTPHONE_USERNAME" | grep -q "Endpoint:" &&
          asterisk -rx "dialplan show 700@ask-by-phone" | grep -q AudioSocket
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  voice-pipeline:
    build:
      context: ./voice-pipeline
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      NO_INPUT_TIMEOUT_S: ${NO_INPUT_TIMEOUT_S:-15}
      QUIET_PERIOD_S: ${QUIET_PERIOD_S:-1.5}
      MAX_REPLY_S: ${MAX_REPLY_S:-60}
      MAX_REPEATS: ${MAX_REPEATS:-3}
      CALL_TTL_S: ${CALL_TTL_S:-3600}
      VAD_THRESHOLD: ${VAD_THRESHOLD:-0.5}
      LOUDNESS_MARGIN_DB: ${LOUDNESS_MARGIN_DB:-12}
      CAPTURE_DIR: ${CAPTURE_DIR:+/captures}
      TTS_VOICE: ${TTS_VOICE:-alba-casual}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-dev.willsawyerrrr.phone-claude.voip}
      DEVICE_SECRET: ${SOFTPHONE_PASSWORD:?Set SOFTPHONE_PASSWORD}
    secrets:
      - apns_key
    volumes:
      - pipeline-data:/data
      - ${CAPTURE_DIR:-./captures}:/captures
    ports:
      - "${PIPELINE_BIND_ADDRESS:-127.0.0.1}:${PIPELINE_PORT:-8080}:8080"
      - "${DEVICE_BIND_ADDRESS:-${HOST_LAN_IP:?Set HOST_LAN_IP to this machine's LAN IP}}:${DEVICE_PORT:-8081}:8081"

  mcp-server:
    build:
      context: ..
      dockerfile: mcp-server/Dockerfile
    restart: unless-stopped
    depends_on:
      asterisk:
        condition: service_healthy
      voice-pipeline:
        condition: service_started
    environment:
      ARI_URL: http://asterisk:8088
      PIPELINE_URL: http://voice-pipeline:8080
      ARI_USERNAME: ${ARI_USERNAME:-phone-claude}
      ARI_PASSWORD: ${ARI_PASSWORD:?Set ARI_PASSWORD}
      SIP_ENDPOINT: ${SOFTPHONE_USERNAME:-phone}
      DIALPLAN_CONTEXT: ${DIALPLAN_CONTEXT:-ask-by-phone}
      DIALPLAN_EXTENSION: ${DIALPLAN_EXTENSION:-700}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-3000}
      MAX_WAIT_MS: ${MAX_WAIT_MS:-600000}
      PUSH_WAIT_MS: ${PUSH_WAIT_MS:-20000}
      RING_TIMEOUT_S: ${RING_TIMEOUT_S:-60}
      MCP_PORT: 80
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-80}:80"

  # Public HTTPS front for the device endpoint; enabled by `COMPOSE_PROFILES=public`.
  caddy:
    profiles: [public]
    build: ./caddy
    restart: unless-stopped
    depends_on:
      - voice-pipeline
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
    # Compose interpolates every service, so the profile-only requirement is checked here.
    command:
      - sh
      - -c
      - >-
        [ -n "$$PUBLIC_HOSTNAME" ] || { echo "Set PUBLIC_HOSTNAME" >&2; exit 1; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "443:443"
    volumes:
      - caddy-data:/data

secrets:
  apns_key:
    file: ${HOME}/.config/phone-claude/apns_key.p8

volumes:
  pipeline-data:
  caddy-data:

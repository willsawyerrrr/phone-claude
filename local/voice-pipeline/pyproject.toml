[project]
name = "voice-pipeline"
version = "0.1.0"
description = "Speaks a question over an Asterisk AudioSocket call and captures the spoken reply."
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10",
  "faster-whisper>=1.1",
  "numpy>=2",
  "onnxruntime>=1.20",
  "piper-tts>=1.3",
  "soxr>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2.3", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 10
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

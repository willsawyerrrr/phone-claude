[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=${TLS_DIR}/cert.pem
priv_key_file=${TLS_DIR}/key.pem
method=tlsv1_2
verify_client=no
verify_server=no
external_signaling_address=${HOST_LAN_IP}
external_signaling_port=${TLS_PORT}
external_media_address=${HOST_LAN_IP}
${LOCAL_NET_LINES}

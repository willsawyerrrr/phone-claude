[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=${HOST_LAN_IP}
external_signaling_port=${SIP_PORT}
external_media_address=${HOST_LAN_IP}
${LOCAL_NET_LINES}
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_signaling_address=${HOST_LAN_IP}
external_signaling_port=${SIP_PORT}
external_media_address=${HOST_LAN_IP}
${LOCAL_NET_LINES}

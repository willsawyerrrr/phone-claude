#include "pjsip_transports.conf"

[${SOFTPHONE_USERNAME}]
type=endpoint
context=from-softphone
disallow=all
allow=g722,ulaw,alaw
auth=${SOFTPHONE_USERNAME}
aors=${SOFTPHONE_USERNAME}
direct_media=no
media_address=${HOST_LAN_IP}
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
${MEDIA_ENCRYPTION_LINE}

[${SOFTPHONE_USERNAME}]
type=auth
auth_type=userpass
username=${SOFTPHONE_USERNAME}
password=${SOFTPHONE_PASSWORD}

[${SOFTPHONE_USERNAME}]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=5
qualify_timeout=2
default_expiration=120
minimum_expiration=30
maximum_expiration=300

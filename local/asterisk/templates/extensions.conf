[general]

; The soft-phone can't dial anything.
[from-softphone]
exten => _X.,1,Hangup()

; `mcp-server` originates a call over ARI into this context; once the
; soft-phone answers, the call's audio streams to the voice pipeline. `CALL_ID`
; (a UUID) is set on the originated channel and keys the AudioSocket stream.
[ask-by-phone]
exten => 700,1,GotoIf($["${LEN(${CALL_ID})}" = "36"]?stream)
 same => n,Hangup()
 same => n(stream),AudioSocket(${CALL_ID},voice-pipeline:9092)
 same => n,Hangup()
